name: Windows Cloud RDP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    env:
      TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
      RDP_USERNAME: "nwdAdmin"
      RDP_PASSWORD: "RdpCloud#2026X9!"

    steps:

      - name: 1. Enable Remote Desktop
        shell: powershell
        run: |
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections' `
            -Value 0

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

      - name: 2. Create Admin Account
        shell: powershell
        run: |
          $password = ConvertTo-SecureString `
            $env:RDP_PASSWORD `
            -AsPlainText `
            -Force

          $existingUser = Get-LocalUser `
            -Name $env:RDP_USERNAME `
            -ErrorAction SilentlyContinue

          if ($existingUser) {
              Set-LocalUser `
                -Name $env:RDP_USERNAME `
                -Password $password
          }
          else {
              New-LocalUser `
                -Name $env:RDP_USERNAME `
                -Password $password `
                -FullName "RDP Administrator"
          }

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member $env:RDP_USERNAME `
            -ErrorAction SilentlyContinue

      - name: 3. Install Tailscale
        shell: powershell
        run: |
          Invoke-WebRequest `
            "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" `
            -OutFile "C:\tailscale.msi"

          Start-Process `
            msiexec.exe `
            -ArgumentList "/i C:\tailscale.msi /quiet /norestart" `
            -Wait

      - name: 4. Connect Tailscale
        shell: powershell
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTHKEY)) {
              throw "TAILSCALE_AUTHKEY secret is empty."
          }

          Start-Sleep -Seconds 5

          & "C:\Program Files\Tailscale\tailscale.exe" up `
            --authkey="$env:TAILSCALE_AUTHKEY" `
            --hostname="github-rdp-server"

          Start-Sleep -Seconds 8

      - name: 5. Show RDP Information
        shell: powershell
        run: |
          $ts_ip = & `
            "C:\Program Files\Tailscale\tailscale.exe" `
            ip -4

          Write-Host ""
          Write-Host "==========================================" -ForegroundColor Green
          Write-Host "       RDP SERVER IS READY" -ForegroundColor Cyan
          Write-Host "==========================================" -ForegroundColor Green
          Write-Host "Tailscale IP : $ts_ip" -ForegroundColor Yellow
          Write-Host "Username     : $env:RDP_USERNAME" -ForegroundColor Yellow
          Write-Host "Password     : $env:RDP_PASSWORD" -ForegroundColor Yellow
          Write-Host "==========================================" -ForegroundColor Green

      - name: 6. Keep Server Alive
        shell: powershell
        run: |
          for ($i = 1; $i -le 360; $i++) {
              Start-Sleep -Seconds 60
              Write-Host "[$i/360] Server running..."
          }
