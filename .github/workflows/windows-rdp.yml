name: Windows Cloud RDP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    env:
      env:
      TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
      RDP_USERNAME: "nwdAdmin"
      RDP_PASSWORD: "Rdp@2026!CloudX9"

    steps:

      - name: 1. Enable Remote Desktop & Firewall
        shell: powershell
        run: |
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections' `
            -Value 0

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          # Keep Network Level Authentication enabled
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'UserAuthentication' `
            -Value 1

      - name: 2. Create Admin Account
        shell: powershell
        run: |
          $password = ConvertTo-SecureString `
            $env:RDP_PASSWORD `
            -AsPlainText `
            -Force

          $existingUser = Get-LocalUser `
            -Name $env:RDP_USERNAME `
            -ErrorAction SilentlyContinue

          if (-not $existingUser) {
              New-LocalUser `
                -Name $env:RDP_USERNAME `
                -Password $password `
                -FullName "RDP Administrator" `
                -Description "Temporary RDP Administrator"
          }
          else {
              Set-LocalUser `
                -Name $env:RDP_USERNAME `
                -Password $password
          }

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member $env:RDP_USERNAME `
            -ErrorAction SilentlyContinue

      - name: 3. Download and Install Tailscale
        shell: powershell
        run: |
          Invoke-WebRequest `
            "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" `
            -OutFile "C:\tailscale.msi"

          Start-Process `
            msiexec.exe `
            -ArgumentList "/i C:\tailscale.msi /quiet /norestart" `
            -Wait

      - name: 4. Connect to Tailscale
        shell: powershell
        run: |
          Start-Sleep -Seconds 5

          & "C:\Program Files\Tailscale\tailscale.exe" up `
            --authkey="$env:TAILSCALE_AUTHKEY" `
            --hostname="github-rdp-server"

          Start-Sleep -Seconds 8

      - name: 5. Get Tailscale IP
        shell: powershell
        run: |
          $ts_ip = & `
            "C:\Program Files\Tailscale\tailscale.exe" `
            ip -4

          Write-Host ""
          Write-Host "==========================================" -ForegroundColor Green
          Write-Host "       >>> RDP SERVER IS READY <<<" -ForegroundColor Cyan
          Write-Host "==========================================" -ForegroundColor Green
          Write-Host "Tailscale IP : $ts_ip" -ForegroundColor Yellow
          Write-Host "Username     : $env:RDP_USERNAME" -ForegroundColor Yellow
          Write-Host "Password     : [Stored in GitHub Secret]" -ForegroundColor Yellow
          Write-Host ""
          Write-Host "Open Remote Desktop (mstsc) and connect to:"
          Write-Host "$ts_ip" -ForegroundColor Magenta
          Write-Host "==========================================" -ForegroundColor Green

      - name: 6. Keep Server Alive
        shell: powershell
        run: |
          for ($i = 1; $i -le 360; $i++) {
              Start-Sleep -Seconds 60
              Write-Host "[$i/360] Server running..."
          }
